    <!--
      Motion gate. Scroll-reveal animations start from opacity:0, which would
      strand content permanently if JS never runs. Every pre-reveal rule is
      scoped to html[data-js="1"], so the prerendered HTML that crawlers and
      no-JS readers receive stays fully visible. Inline and synchronous on
      purpose: it must land before the first paint, or revealed content would
      flash in and back out.
    -->
    <script>
      document.documentElement.dataset.js = "1";
    </script>

    <!--
      Applies the stored theme before first paint. The theme is a data
      attribute (see src/lib/useTheme.ts), and the prerendered HTML is always
      the default dark — without this a light-theme reader would see dark
      until the app's JS ran. Mirrors STORAGE_KEY and CHROME there.
    -->
    <script>
      try {
        var t = localStorage.getItem("ekb-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          if (t === "light") {
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#eef0f4");
          }
        }
      } catch (e) {}
    </script>
