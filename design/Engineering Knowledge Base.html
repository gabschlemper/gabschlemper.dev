  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

card:#FFFFFF;--border:#E6E2D9;--border2:#CFC9BD;--text:#1B1915;--text2:#6E685D;--text3:#9C9587;--accent:#2563EB;--sel:rgba(37,99,235,.12)}\n*{box-sizing:border-box}\nhtml{background:var(--bg)}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:'Courier Prime',monospace;-webkit-font-smoothing:antialiased}\na{color:var(--accent);text-decoration:none}\na:hover{color:var(--accent);text-decoration:underline}\n::selection{background:var(--sel)}\n@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--bg);display:flex;transition:background .25s\">\n  <div style=\"position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none\">\n    <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"height:2px;background:var(--accent);width:{{ progressPct }};transition:width .1s linear\"><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <aside data-screen-label=\"Navigation\" style=\"width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--panel);padding:26px 18px 20px;display:flex;flex-direction:column;gap:20px\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;padding:0 8px\">\n      <div style=\"font-family:'Special Elite','Courier Prime',monospace;font-size:17px;line-height:1.3;color:var(--text)\">Engineering<br>Knowledge Base<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3);margin-top:6px;letter-spacing:0.06em\">gabriela schlemper · public docs<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ openPalette }}\" style-hover=\"border-color:var(--border2);color:var(--text2)\" style=\"display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);background:var(--card);border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:12px;transition:all .15s\">\n      <span>search…<\u002Fspan><span style=\"border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px\">⌘K<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:18px\">\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);padding:0 10px 6px\">{{ g.label }}<\u002Fdiv>\n          <sc-for list=\"{{ g.links }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ l.go }}\" style-hover=\"color:var(--text)\" style=\"display:flex;align-items:baseline;gap:10px;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:14.5px;transition:all .12s;color:{{ l.color }};background:{{ l.bg }}\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)\">{{ l.n }}<\u002Fspan>\n              <span>{{ l.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px\">\n      <div sc-camel-on-click=\"{{ toggleTheme }}\" style-hover=\"border-color:var(--border2)\" style=\"border:1px solid var(--border);border-radius:6px;padding:7px 10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);display:flex;justify-content:space-between;transition:all .15s\">\n        <span>theme<\u002Fspan><span style=\"color:var(--text)\">{{ themeLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);padding:0 2px\">rev. 2026.07 — written, not generated<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n  <main style=\"flex:1;min-width:0\">\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Home\" style=\"max-width:880px;margin:0 auto;padding:64px 48px 96px;animation:fadeIn .3s\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">index / readme<\u002Fdiv>\n      <h1 style=\"font-family:'Special Elite','Courier Prime',monospace;font-weight:400;font-size:42px;line-height:1.12;margin:14px 0 4px;color:var(--text)\">Gabriela Schlemper<\u002Fh1>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent)\">software engineer<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)\">distributed systems · frontend · Dynamox<\u002Fspan>\n        <sc-if value=\"{{ openToWork }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 8px;letter-spacing:0.06em\">open to opportunities<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap\">\n        <sc-for list=\"{{ contactLinks }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <a href=\"{{ l.href }}\" target=\"_blank\" style-hover=\"border-color:var(--accent);text-decoration:none\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);border:1px solid var(--border2);background:var(--card);border-radius:5px;padding:6px 14px;transition:all .15s;text-decoration:none\">{{ l.label }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:19px;line-height:1.6;color:var(--text);max-width:640px;margin:0 0 14px;text-wrap:pretty\">I document engineering decisions instead of listing technologies.<\u002Fp>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--text2);max-width:640px;margin:0;text-wrap:pretty\">Every experience in this repository answers one question: <span style=\"color:var(--text)\">\"What evidence does this give about the engineer I am?\"<\u002Fspan><\u002Fp>\n\n      <div style=\"margin-top:56px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">career journey<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;gap:10px;align-items:stretch;margin-top:16px\">\n        <sc-for list=\"{{ homeCompanies }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <sc-if value=\"{{ c.isArrow }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:15px\">→<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ c.isCard }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style-hover=\"border-color:var(--border2);transform:translateY(-2px)\" style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;padding:16px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3)\">{{ c.period }}<\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:700;color:var(--text)\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:var(--text2)\">{{ c.phase }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:56px;display:flex;align-items:baseline;justify-content:space-between\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">highlighted case studies<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goCases }}\" style-hover=\"text-decoration:underline\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);cursor:pointer\">all 10 →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:16px\">\n        <sc-for list=\"{{ featured }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ f.go }}\" style-hover=\"border-color:var(--border2);transform:translateY(-2px)\" style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;padding:22px 24px;cursor:pointer;transition:all .18s\">\n            <div style=\"display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:8px\">\n              <span style=\"color:var(--accent)\">{{ f.company }}<\u002Fspan><span>{{ f.category }}<\u002Fspan><span style=\"margin-left:auto\">{{ f.rt }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:17.5px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px;text-wrap:pretty\">{{ f.title }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;color:var(--text2);text-wrap:pretty;margin-bottom:12px\">{{ f.summary }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)\">impact: <span style=\"color:var(--text2)\">{{ f.impact }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showStats }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:56px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">repository statistics<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr); }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:52px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">where it happened<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:16px\">\n        <sc-for list=\"{{ journeyCompanies }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ c.go }}\" style-hover=\"border-color:var(--border2);transform:translateY(-2px)\" style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;padding:20px 24px;cursor:pointer;transition:all .18s\">\n            <div style=\"display:flex;gap:14px;align-items:baseline\">\n              <span style=\"font-size:16px;font-weight:700;color:var(--text)\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)\">{{ c.period }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-left:auto\">{{ c.role }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;color:var(--text2);margin-top:8px;text-wrap:pretty\">{{ c.summary }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCompanies }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Companies\" style=\"max-width:820px;margin:0 auto;padding:64px 48px 96px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">companies / 3 entries<\u002Fdiv>\n      <h1 style=\"font-family:'Special Elite','Courier Prime',monospace;font-weight:400;font-size:34px;margin:14px 0 28px;color:var(--text)\">Companies<\u002Fh1>\n      <div style=\"display:flex;flex-d }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style-hover=\"border-color:var(--accent)\" style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;padding:10px 16px;cursor:pointer;transition:all .15s\">\n              <span style=\"font-size:13.5px;font-weight:700;color:var(--text)\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3);margin-left:10px\">{{ c.period }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ techHasCases }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">appears in<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px\">\n          <sc-for list=\"{{ techCases }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style-hover=\"border-color:var(--border2);transform:translateY(-2px)\" style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;padding:16px 20px;cursor:pointer;transition:all .18s\">\n              <div style=\"display:flex;gap:12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3);margin-bottom:6px\"><span style=\"color:var(--accent)\">{{ c.company }}<\u002Fspan><span>{{ c.category }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:14.5px;font-weight:700;color:var(--text);text-wrap:pretty\">{{ c.title }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrinciples }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Engineering Principles\" style=\"max-width:820px;margin:0 auto;padding:64px 48px 96px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">principles / earned, not adopted<\u002Fdiv>\n      <h1 style=\"font-family:'Special Elite','Courier Prime',monospace;font-weight:400;font-size:34px;margin:14px 0 6px;color:var(--text)\">Engineering Principles<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--text2);max-width:640px;text-wrap:pretty\">Each principle has an origin story and at least one place it was applied again. Open one.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:28px\">\n        <sc-for list=\"{{ principlesList }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;overflow:hidden;transition:border-color .15s\">\n            <div sc-camel-on-click=\"{{ p.toggle }}\" style-hover=\"background:var(--panel)\" style=\"padding:18px 22px;cursor:pointer;display:flex;gap:16px;align-items:baseline;transition:background .15s\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);flex-shrink:0\">{{ p.n }}<\u002Fspan>\n              <span style=\"font-family:'Special Elite','Courier Prime',monospace;font-size:16.5px;line-height:1.5;color:var(--text);text-wrap:pretty\">{{ p.text }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text3);flex-shrink:0\">{{ p.chev }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ p.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid var(--border);padding:20px 22px;display:flex;flex-direction:column;gap:16px;animation:fadeIn .25s\">\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">explanation<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.7;color:var(--text);text-wrap:pretty\">{{ p.explanation }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">origin<\u002Fdiv>\n                  <div style=\"font-size:13.5px;line-height:1.65;color:var(--text2);text-wrap:pretty\">{{ p.origin }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.hasCase }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">related case study<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ p.caseGo }}\" style-hover=\"text-decoration:underline\" style=\"font-size:13.5px;color:var(--accent);cursor:pointer\">{{ p.caseTitle }} →<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px\">where i applied it again<\u002Fdiv>\n                  <div style=\"font-size:13.5px;line-height:1.65;color:var(--text2);text-wrap:pretty\">{{ p.applied }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Evidence Map\" style=\"max-width:1200px;margin:0 auto;padding:64px 48px 96px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">evidence map / why each claim holds<\u002Fdiv>\n      <h1 style=\"font-family:'Special Elite','Courier Prime',monospace;font-weight:400;font-size:34px;margin:14px 0 6px;color:var(--text)\">Evidence Map<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--text2);max-width:680px;text-wrap:pretty\">Capabilities connect to the case studies that prove them, the companies where they happened, and the technologies involved. Hover to trace a claim. Click any node to open its document.<\u002Fp>\n      <div style=\"border:1px solid var(--border);background:var(--card);border-radius:6px;margin-top:28px;padding:12px;overflow-x:auto\">\n        <div style=\"position:relative;width:1080px;height:{{ mapH }}px\">\n          <svg width=\"1080\" height=\"{{ mapH }}\" style=\"position:absolute;inset:0;display:block\">\n            <sc-for list=\"{{ mapEdges }}\" as=\"e\" hint-placeholder-count=\"0\">\n              <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.stroke }}\" stroke-width=\"1.1\" opacity=\"{{ e.op }}\" style=\"transition:opacity .15s\"><\u002Fpath>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ mapCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"position:absolute;left:{{ c.x }}px;top:20px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)\">{{ c.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ mapNodes }}\" as=\"n\" hint-placeholder-count=\"0\">\n            <div sc-camel-on-mouse-enter=\"{{ n.over }}\" sc-camel-on-mouse-leave=\"{{ n.out }}\" sc-camel-on-click=\"{{ n.go }}\" style=\"position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:{{ n.w }}px;height:26px;display:flex;align-items:center;padding:0 10px;border:1.2px solid {{ n.stroke }};border-radius:5px;background:var(--card);cursor:pointer;transition:opacity .15s;opacity:{{ n.op }};font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap;color:{{ n.tfill }}\">{{ n.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ paletteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closePalette }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);z-index:100;display:flex;justify-content:center;padding-top:14vh;animation:fadeIn .15s\">\n      <div sc-camel-on-click=\"{{ eatClick }}\" data-screen-label=\"Command palette\" style=\"width:620px;max-height:60vh;height:fit-content;background:var(--card);border:1px solid var(--border2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,0.4)\">\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"search companies, case studies, capabilities, principles…\" style=\"border:none;outline:none;background:transparent;color:var(--text);padding:16px 20px;font-family:'JetBrains Mono',monospace;font-size:14px;border-bottom:1px solid var(--border)\">\n        <div style=\"overflow-y:auto;padding:8px\">\n          <sc-for list=\"{{ searchResults }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ r.go }}\" sc-camel-on-mouse-enter=\"{{ r.hover }}\" style=\"display:flex;align-items:baseline;gap:12px;padding:10px 12px;border-radius:6px;cursor:pointer;background:{{ r.bg }}\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;flex-shrink:0;width:78px;text-align:center\">{{ r.kind }}<\u002Fspan>\n              <span style=\"font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;max-width:300px\">{{ r.title }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.sub }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ searchEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text3)\">no documents match<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--border);padding:8px 16px;display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)\"><span>↑↓ navigate<\u002Fspan><span>↵ open<\u002Fspan><span>esc close<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7DA3EE&quot;,&quot;options&quot;:[&quot;#7DA3EE&quot;,&quot;#5EBF9B&quot;,&quot;#E0A65C&quot;,&quot;#C08FE8&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;openToWork&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Recruiter&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;you@example.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Recruiter&quot;},&quot;linkedin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://linkedin.com/in/your-profile&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Recruiter&quot;},&quot;github&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/your-user&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Recruiter&quot;},&quot;cvUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Recruiter&quot;}}\">\nclass Component extends DCLogic {\n  state = { route:{page:'home',id:''}, theme:'dark', paletteOpen:false, query:'', selIdx:0, mapFocus:null, principleOpen:null, progress:0, activeSec:'', copied:false, dbReady:false };\n\n  componentDidMount(){\n    import(window.__resources.dataJs).then(m=>{ this.db=m.DB; this.setState({dbReady:true}); });\n    let saved=null; try{ saved=localStorage.getItem('ekb-theme'); }catch(e){}\n    this.applyTheme(saved||this.props.defaultTheme||'dark',false);\n    this.applyAccent();\n    this._key=e=>this.onKey(e); this._hash=()=>this.onHash(); this._scroll=()=>this.onScroll();\n    window.addEventListener('keydown',this._key);\n    window.addEventListener('hashchange',this._hash);\n    window.addEventListener('scroll',this._scroll,{passive:true});\n    this.onHash();\n  }\n  componentDidUpdate(){ this.applyAccent(); }\n  componentWillUnmount(){\n    window.removeEventListener('keydown',this._key);\n    window.removeEventListener('hashchange',this._hash);\n    window.removeEventListener('scroll',this._scroll);\n  }\n  applyAccent(){ const a=this.props.accent; if(a&&a!==this._accent){ this._accent=a; document.documentElement.style.setProperty('--accent',a); document.documentElement.style.setProperty('--sel','color-mix(in srgb, '+a+' 18%, transparent)'); } }\n  applyTheme(t,persist){ document.documentElement.dataset.theme=t; if(persist){ try{ localStorage.setItem('ekb-theme',t); }catch(e){} } this.setState({theme:t}); }\n  nav(page,id){ const h='/'+page+(id?'/'+encodeURIComponent(id):''); if(location.hash==='#'+h){ this.setState({paletteOpen:false}); window.scrollTo(0,0); return; } location.hash=h; }\n  onHash(){ const p=(location.hash||'').replace(/^#\\/?/,'').split('/'); this.setState({route:{page:p[0]||'home',id:decodeURIComponent(p[1]||'')},paletteOpen:false,mapFocus:null,activeSec:'',progress:0,principleOpen:null}); window.scrollTo(0,0); }\n  onKey(e){\n    if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); this.setState(s=>({paletteOpen:!s.paletteOpen,query:'',selIdx:0})); return; }\n    if(!this.state.paletteOpen) return;\n    if(e.key==='Escape'){ this.setState({paletteOpen:false}); }\n    else if(e.key==='ArrowDown'){ e.preventDefault(); const n=this.results().length; this.setState(s=>({selIdx:Math.min(s.selIdx+1,Math.max(0,n-1))})); }\n    else if(e.key==='ArrowUp'){ e.preventDefault(); this.setState(s=>({selIdx:Math.max(s.selIdx-1,0)})); }\n    else if(e.key==='Enter'){ const r=this.results()[this.state.selIdx]; if(r) this.nav(r.page,r.id); }\n  }\n  onScroll(){\n    if(this._raf) return;\n    this._raf=requestAnimationFrame(()=>{\n      this._raf=null;\n      const max=document.documentElement.scrollHeight-window.innerHeight;\n      const progress=max>0?Math.min(1,window.scrollY/max):0;\n      let activeSec=this.state.activeSec;\n      if(this.state.route.page==='case'){\n        let cur=''; document.querySelectorAll('[data-sec]').forEach(el=>{ if(el.getBoundingClientRect().top<150) cur=el.getAttribute('data-sec'); });\n        activeSec=cur;\n      }\n      if(Math.abs(progress-this.state.progress)>0.004||activeSec!==this.state.activeSec) this.setState({progress,activeSec});\n    });\n  }\n  scrollToSec(id){ const el=document.getElementById('sec-'+id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'}); }\n  copy(){ try{ navigator.clipboard.writeText(location.href); }catch(e){} this.setState({copied:true}); clearTimeout(this._ct); this._ct=setTimeout(()=>this.setState({copied:false}),1600); }\n\n  index(){\n    if(this._ix||!this.db) return this._ix||[];\n    const db=this.db, ix=[];\n    db.companies.forEach(c=>ix.push({kind:'company',title:c.name,sub:c.role+' · '+c.period,page:'company',id:c.id,hay:c.name+' '+c.domain+' '+c.summary}));\n    db.cases.forEach(c=>ix.push({kind:'case',title:c.title,sub:c.company+' · '+c.category,page:'case',id:c.id,hay:c.title+' '+c.summary+' '+c.capabilities.join(' ')+' '+c.technologies.join(' ')}));\n    db.capabilities.forEach(c=>ix.push({kind:'capability',title:c.name,sub:c.desc,page:'capability',id:c.id,hay:c.name+' '+c.desc}));\n    db.technologies.forEach(t=>ix.push({kind:'tech',title:t.name,sub:t.usage,page:'tech',id:t.name,hay:t.name+' '+t.usage}));\n    [['Profile','profile','technical identity'],['Companies','companies','3 entries'],['Case Studies','cases','10 entries']].forEach(p=>ix.push({kind:'page',title:p[0],sub:p[2],page:p[1],id:'',hay:p[0]+' '+p[2]}));\n    this._ix=ix; return ix;\n  }\n  results(){\n    const q=this.state.query.trim().toLowerCase(); const ix=this.index();\n    if(!q) return ix.filter(r=>r.kind==='page'||(r.kind==='case'&&this.db.cases.find(c=>c.id===r.id&&c.featured))).slice(0,8);\n    return ix.filter(r=>(r.hay+' '+r.title).toLowerCase().includes(q)).slice(0,10);\n  }\n\n  buildMap(){\n    const db=this.db;\n    if(!db) return {h:600,cols:[],nodes:[],edges:[]};\n    const focus=this.state.mapFocus;\n    const caps=db.capabilities.filter(c=>db.cases.some(cs=>cs.capabilities.includes(c.name)));\n    const cases=db.cases, cos=db.companies;\n    const techSet=new Set(); cases.forEach(c=>c.technologies.forEach(t=>techSet.add(t)));\n    const techs=db.technologies.filter(t=>techSet.has(t.name));\n    const H=Math.max(caps.length,cases.length,techs.length)*47+100;\n    const colY=(n,i)=>{ const pad=76; if(n<=1) return H/2-13; const sp=Math.min(60,(H-2*pad)/(n-1)); return H/2-sp*(n-1)/2+i*sp-13; };\n    const tw=s=>Math.round(s.length*6.7)+22;\n    const nm={}, nodes=[], edgesRaw=[], adj={};\n    const addNode=(key,label,x,y,w,page,id)=>{ nm[key]={x,y,w}; nodes.push({key,label,x,y,w,page,id}); adj[key]=new Set(); };\n    caps.forEach((c,i)=>{ const w=tw(c.name); addNode('cap:'+c.name,c.name,258-w,colY(caps.length,i),w,'capability',c.id); });\n    cases.forEach((c,i)=>{ const label=c.title.length>36?c.title.slice(0,35)+'…':c.title; addNode('case:'+c.id,label,330,colY(cases.length,i),tw(label),'case',c.id); });\n    cos.forEach((c,i)=>{ addNode('co:'+c.id,c.name,700,colY(cos.length,i),tw(c.name),'company',c.id); });\n    techs.forEach((t,i)=>{ addNode('tech:'+t.name,t.name,880,colY(techs.length,i),tw(t.name),'tech',t.name); });\n    const addEdge=(a,b)=>{ if(!nm[a]||!nm[b]) return; adj[a].add(b); adj[b].add(a); edgesRaw.push([a,b]); };\n    cases.forEach(c=>{\n      c.capabilities.forEach(cap=>addEdge('cap:'+cap,'case:'+c.id));\n      const co=cos.find(x=>x.name===c.company); if(co) addEdge('case:'+c.id,'co:'+co.id);\n    });\n    cos.forEach(co=>co.technologies.forEach(t=>{ if(techSet.has(t)) addEdge('co:'+co.id,'tech:'+t); }));\n    const act=focus?new Set([focus,...(adj[focus]||[])]):null;\n    const edges=edgesRaw.map(([a,b])=>{\n      const A=nm[a],B=nm[b];\n      const x1=A.x+A.w,y1=A.y+13,x2=B.x,y2=B.y+13,mx=(x1+x2)/2;\n      const hot=focus&&(a===focus||b===focus);\n      return { d:'M'+x1+' '+y1+' C'+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2,\n        stroke:hot?'var(--accent)':'var(--border2)', op:focus?(hot?0.9:0.06):0.5 };\n    });\n    const outNodes=nodes.map(n=>{\n      const on=!focus||act.has(n.key), isF=focus===n.key;\n      return { x:n.x,y:n.y,w:n.w,label:n.label,\n        op:on?1:0.16, stroke:isF?'var(--accent)':(focus&&on?'var(--text3)':'var(--border2)'),\n        tfill:on?'var(--text)':'var(--text2)',\n        over:()=>this.setState({mapFocus:n.key}), out:()=>this.setState({mapFocus:null}), go:()=>this.nav(n.page,n.id) };\n    });\n    return { h:H,\n      cols:[{x:30,label:'capabilities'},{x:330,label:'case studies'},{x:700,label:'companies'},{x:880,label:'technologies'}],\n      nodes:outNodes, edges };\n  }\n\n  renderVals(){\n    const db=this.db||null; const {route,theme,paletteOpen,query,selIdx,principleOpen,progress,activeSec,copied}=this.state;\n    const P=(page,id)=>()=>this.nav(page,id);\n    const pageOf={company:'companies',case:'cases',capability:'capabilities',tech:'technologies'};\n    const activePage=pageOf[route.page]||route.page;\n    let n=0;\n    const groups=[\n      {label:'overview',links:[['Home','home'],['Profile','profile']]},\n      {label:'evidence',links:[['Companies','companies'],['Case Studies','cases'],['Capabilities','capabilities'],['Technologies','technologies']]}\n    ].map(g=>({label:g.label,links:g.links.map(l=>{ n++; const on=activePage===l[1];\n      return {n:(n<10?'0':'')+n,label:l[0],go:P(l[1]==='home'?'':'home'===l[1]?'':l[1],''),color:on?'var(--text)':'var(--text2)',bg:on?'var(--card)':'transparent',go:P(l[1]==='home'?'home':l[1],'')}; })}));\n    const cases=db?db.cases:[], cos=db?db.companies:[], capsAll=db?db.capabilities:[], techsAll=db?db.technologies:[], prins=db?db.principles:[];\n    const capById=id=>capsAll.find(c=>c.id===id);\n    const caseCard=c=>({title:c.title,summary:c.summary,company:c.company,category:c.category,rt:c.readingTime,go:P('case',c.id)});\n    const vals={\n      navGroups:groups, themeLabel:theme==='dark'?'dark ●':'light ○',\n      toggleTheme:()=>this.applyTheme(this.state.theme==='dark'?'light':'dark',true),\n      goHome:P('home',''),goJourney:P('journey',''),goCases:P('cases',''),goCompanies:P('companies',''),goCaps:P('capabilities',''),goTechs:P('technologies',''),\n      openPalette:()=>this.setState({paletteOpen:true,query:'',selIdx:0}),\n      closePalette:()=>this.setState({paletteOpen:false}),\n      eatClick:e=>e.stopPropagation(),\n      paletteOpen, query,\n      setQuery:e=>this.setState({query:e.target.value,selIdx:0}),\n      showProgress:route.page==='case', progressPct:Math.round(progress*100)+'%',\n      isHome:route.page==='home',isProfile:route.page==='profile',isJourney:route.page==='journey',\n      isCompanies:route.page==='companies',isCompany:route.page==='company',isCases:route.page==='cases',isCase:route.page==='case',\n      isCaps:route.page==='capabilities',isCap:route.page==='capability',isTechs:route.page==='technologies',isTech:route.page==='tech',\n      isPrinciples:route.page==='principles',isMap:route.page==='map',\n      quote:db?db.profile.quote:'', showStats:this.props.showStats!==false,\n      openToWork:this.props.openToWork!==false,\n      contactLinks:[\n        {label:'email',href:'mailto:'+(this.props.email||'you@example.com')},\n        {label:'linkedin',href:this.props.linkedin||'https://linkedin.com/in/your-profile'},\n        {label:'github',href:this.props.github||'https://github.com/your-user'},\n        {label:'download cv ↓',href:this.props.cvUrl||'#'}\n      ],\n      stats:db?db.stats:[],\n    };\n    // home\n    const homeCos=[]; cos.forEach((c,i)=>{ if(i>0) homeCos.push({isArrow:true,isCard:false}); homeCos.push({isArrow:false,isCard:true,name:c.name,period:c.period,phase:c.phase,go:P('company',c.id)}); });\n    vals.homeCompanies=homeCos;\n    vals.featured=cases.filter(c=>c.featured).map(c=>({...caseCard(c),impact:c.impact.join(' · ')}));\n    // profile\n    if(db){ const pr=db.profile;\n      Object.assign(vals,{aboutParas:pr.about,philosophy:pr.philosophy,evolution:pr.evolution,howIThink:pr.howIThink,strengths:pr.strengths,interests:pr.interests,preferredProblems:pr.preferredProblems});\n    } else Object.assign(vals,{aboutParas:[],philosophy:[],evolution:[],howIThink:[],strengths:[],interests:[],preferredProblems:[]});\n    // journey\n    vals.journeyItems=db?db.profile.evolution.map((e,i)=>({...e,delay:(i*0.12)+'s'})):[];\n    vals.journeyCompanies=cos.map(c=>({name:c.name,period:c.period,role:c.role,summary:c.phase+' — '+c.summary,go:P('company',c.id)}));\n    // companies\n    vals.companiesList=cos.map(c=>({name:c.name,period:c.period,role:c.role,summary:c.summary,phase:'phase: '+c.phase.toLowerCase(),meta:c.caseIds.length+' case studies · '+c.technologies.length+' technologies',go:P('company',c.id)}));\n    const co=route.page==='company'&&db?cos.find(c=>c.id===route.id):null;\n    if(co){ Object.assign(vals,{coName:co.name,coRole:co.role,coPeriod:co.period,coDomain:co.domain,coSummary:co.summary,\n      coOverview:co.overview,coBizDomain:co.businessDomain,coResp:co.responsibilities,coAch:co.achievements,coLessons:co.lessons,\n      coTech:co.technologies.map(t=>({name:t,go:P('tech',t)})),\n      coHasCases:co.caseIds.length>0,\n      coCases:co.caseIds.map(id=>cases.find(c=>c.id===id)).filter(Boolean).map(c=>({title:c.title,category:c.category,rt:c.readingTime,go:P('case',c.id)}))});\n    } else Object.assign(vals,{coName:'',coRole:'',coPeriod:'',coDomain:'',coSummary:'',coOverview:[],coBizDomain:[],coResp:[],coAch:[],coLessons:[],coTech:[],coHasCases:false,coCases:[]});\n    // cases index\n    const sorted=[...cases].sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));\n    vals.allCases=sorted.map(c=>({...caseCard(c),badge:c.featured?'★ featured · '+c.readingTime:c.readingTime,leftBorder:c.featured?'2px solid var(--accent)':'1px solid var(--border)'}));\n    // case detail\n    const cs=route.page==='case'&&db?cases.find(c=>c.id===route.id):null;\n    if(cs){\n      const secs=cs.sections.map((s,i)=>({id:s.id,n:(i<9?'0':'')+(i+1),title:s.title,paras:s.paras||[],bullets:s.bullets||[]}));\n      Object.assign(vals,{csId:cs.id,csTitle:cs.title,csSummary:cs.summary,csSections:secs,\n        csMeta:[{k:'category',v:cs.category},{k:'difficulty',v:cs.difficulty},{k:'ownership',v:cs.ownership},{k:'customer facing',v:cs.customerFacing},{k:'reading time',v:cs.readingTime}],\n        csCompany:cs.company,csCompanyGo:P('company',(cos.find(x=>x.name===cs.company)||{}).id||''),\n        csCaps:cs.capabilities.map(name=>{ const cap=capsAll.find(c=>c.name===name); return {name,go:cap?P('capability',cap.id):()=>{}}; }),\n        csTechs:cs.technologies.map(t=>({name:t,go:P('tech',t)})),\n        csAnchors:secs.map(s=>({title:s.title,go:()=>this.scrollToSec(s.id),color:activeSec===s.id?'var(--text)':'var(--text3)',bar:activeSec===s.id?'var(--accent)':'transparent'})),\n        copyLink:()=>this.copy(),copyLabel:copied?'✓ link copied':'copy link'});\n    } else Object.assign(vals,{csId:'',csTitle:'',csSummary:'',csSections:[],csMeta:[],csCompany:'',csCompanyGo:()=>{},csCaps:[],csTechs:[],csAnchors:[],copyLink:()=>{},copyLabel:'copy link'});\n    // capabilities\n    const casesForCap=name=>cases.filter(c=>c.capabilities.includes(name));\n    const cosForCap=name=>cos.filter(c=>(c.capabilities||[]).includes(name));\n    vals.capsList=capsAll.map(c=>{ const cc=casesForCap(c.name), co2=cosForCap(c.name); const total=cc.length+co2.length;\n      return {name:c.name,desc:c.desc,squares:Array.from({length:Math.min(8,total)},()=>({})),evidence:cc.length+' case studies · '+co2.length+' companies',go:P('capability',c.id)}; });\n    const cap=route.page==='capability'&&db?capById(route.id):null;\n    if(cap){ const cc=casesForCap(cap.name), co2=cosForCap(cap.name);\n      Object.assign(vals,{capName:cap.name,capDesc:cap.desc,capEvidenceLabel:'evidence: '+cc.length+' proving documents · '+co2.length+' companies',\n        capHasCases:cc.length>0,capCases:cc.map(caseCard),capHasCos:co2.length>0,\n        capCompanies:co2.map(c=>({name:c.name,period:c.period,go:P('company',c.id)}))});\n    } else Object.assign(vals,{capName:'',capDesc:'',capEvidenceLabel:'',capHasCases:false,capCases:[],capHasCos:false,capCompanies:[]});\n    // technologies\n    const casesForTech=name=>cases.filter(c=>c.technologies.includes(name));\n    const cosForTech=name=>cos.filter(c=>c.technologies.includes(name));\n    vals.techsList=techsAll.map(t=>{ const tc=casesForTech(t.name),tco=cosForTech(t.name);\n      return {name:t.name,usage:t.usage,meta:(tco.length?tco.map(c=>c.name).join(' · '):'freelance'),go:P('tech',t.name)}; });\n    const tech=route.page==='tech'&&db?techsAll.find(t=>t.name===route.id):null;\n    if(tech){ const tc=casesForTech(tech.name),tco=cosForTech(tech.name);\n      Object.assign(vals,{techName:tech.name,techUsage:tech.usage,techHasCos:tco.length>0,\n        techCompanies:tco.map(c=>({name:c.name,period:c.period,go:P('company',c.id)})),\n        techHasCases:tc.length>0,techCases:tc.map(caseCard)});\n    } else Object.assign(vals,{techName:'',techUsage:'',techHasCos:false,techCompanies:[],techHasCases:false,techCases:[]});\n    // principles\n    vals.principlesList=prins.map((p,i)=>{ const open=principleOpen===p.id; const rc=p.caseId?cases.find(c=>c.id===p.caseId):null;\n      return {n:'P'+(i+1),text:p.text,open,chev:open?'−':'+',toggle:()=>this.setState(s=>({principleOpen:s.principleOpen===p.id?null:p.id})),\n        explanation:p.explanation,origin:p.origin,applied:p.applied,hasCase:!!rc,caseTitle:rc?rc.title:'',caseGo:rc?P('case',rc.id):()=>{}}; });\n    // map\n    if(route.page==='map'){ const m=this.buildMap(); vals.mapH=m.h; vals.mapCols=m.cols; vals.mapNodes=m.nodes; vals.mapEdges=m.edges; }\n    else { vals.mapH=600; vals.mapCols=[]; vals.mapNodes=[]; vals.mapEdges=[]; }\n    // search\n    const res=this.results();\n    vals.searchResults=res.map((r,i)=>({kind:r.kind,title:r.title,sub:r.sub,bg:i===selIdx?'var(--sel)':'transparent',hover:()=>this.setState({selIdx:i}),go:()=>this.nav(r.page,r.id)}));\n    vals.searchEmpty=paletteOpen&&res.length===0;\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
